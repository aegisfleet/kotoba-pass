<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Shackle -->
  <path d="M192 230 V160 C192 124.6 220.6 96 256 96 C291.4 96 320 124.6 320 160 V230" 
        fill="none" 
        stroke="url(#lockGrad)" 
        stroke-width="36" 
        stroke-linecap="round" />

  <!-- Lock Body -->
  <rect x="144" y="220" width="224" height="192" rx="36" fill="url(#lockGrad)" />

  <!-- Keyhole -->
  <circle cx="256" cy="296" r="22" fill="#4338ca" />
  <polygon points="246,296 266,296 272,352 240,352" fill="#4338ca" />
</svg>
